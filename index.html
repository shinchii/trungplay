<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>APTV CARPLAY DRIVE - KHÔNG GIAN ÂM NHẠC XE HƠI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- App Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- =========================================================
         SITE HEADER (THANH TÌM KIẾM TRỰC TIẾP)
         ========================================================= -->
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-icon">
                    <div class="brand-icon-core"></div>
                    <div class="brand-icon-ring ring-1"></div>
                    <div class="brand-icon-ring ring-2"></div>
                </div>
                <div class="brand-text">
                    <span class="brand-name">APTV CARPLAY DRIVE</span>
                    <span class="brand-subtitle">
                        <span class="loading-dot"></span> KHÔNG GIAN ÂM NHẠC TRÊN XE
                    </span>
                </div>
            </div>

            <!-- Header Search Bar -->
            <div class="header-search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="txtSearchkey" placeholder="Nhập tên bài hát hoặc ca sĩ (Ví dụ: MCK, Sơn Tùng, Đen Vâu, Lofi, Bolero...)..." tabindex="0" autocomplete="off">
                <button id="btnVoiceSearch" class="btn-voice-search" tabindex="0" title="Tìm bằng giọng nói Tiếng Việt" aria-label="Nói giọng nói">
                    <i class="fa-solid fa-microphone"></i>
                </button>
            </div>

            <div class="header-right">
                <div class="clock-display" id="car-clock">12:00</div>
            </div>
        </div>
    </header>

    <!-- Voice Notice Banner -->
    <div id="searchVoiceNotice" class="search-thongbao-giongnoi" style="display: none;">
        <i class="fa-solid fa-microphone-lines fa-bounce text-red"></i>
        <span id="voice-notice-text">Bấm microphone để nói tên bài hát hoặc ca sĩ...</span>
    </div>

    <!-- =========================================================
         MAIN APPLICATION CONTENT
         ========================================================= -->
    <main class="app">
        <div class="layout">
            <section class="content">

                <!-- VIDEO PLAYER CARD -->
                <div class="video-card">
                    <div class="player">
                        <iframe id="youtubePlayer" 
                                src="https://www.youtube.com/embed/jFfP7kU2rE8?enablejsapi=1&autoplay=0&playsinline=1&rel=0" 
                                title="YouTube Video Player" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen 
                                tabindex="0">
                        </iframe>
                    </div>

                    <div class="video-info">
                        <div class="current-label">ĐANG PHÁT</div>
                        <h2 id="currentTitle" class="current-title">Chìm Sâu</h2>
                        <p id="currentArtist" class="song-artist">RPT MCK ft. Trung Trần</p>
                    </div>
                </div>

                <!-- YOUTUBE CONTROLS BAR (demohdc TIMELINE & CONTROLS) -->
                <div class="youtube-controls">
                    <div class="youtube-timeline-row">
                        <div class="youtube-time">
                            <span id="youtubeCurrentTime">00:00</span>
                            <span>/</span>
                            <span id="youtubeDuration">00:00</span>
                        </div>
                        <div class="youtube-progress" id="youtubeProgress" tabindex="0" title="Kéo/Click để tua">
                            <div id="youtubeProgressBar"></div>
                        </div>
                    </div>

                    <div class="youtube-actions-row">
                        <div class="youtube-button-group">
                            <button id="btnPrevVideo" tabindex="0" title="Bài trước"><i class="fa-solid fa-backward-step"></i></button>
                            <button id="btnPlayPause" tabindex="0" title="Phát / Tạm dừng"><i class="fa-solid fa-play" id="iconPlayPause"></i></button>
                            <button id="btnNextVideo" tabindex="0" title="Bài tiếp"><i class="fa-solid fa-forward-step"></i></button>
                            <button id="btnRepeatMode" class="youtube-mode-btn" tabindex="0" title="Chế độ lặp"><i class="fa-solid fa-repeat" id="iconRepeat"></i></button>
                            <button id="btnShuffleMode" class="youtube-mode-btn" tabindex="0" title="Phát ngẫu nhiên"><i class="fa-solid fa-shuffle" id="iconShuffle"></i></button>
                        </div>

                        <div class="favorite-bar">
                            <button id="btnYeuThich" tabindex="0" title="Thêm vào yêu thích">
                                <i class="fa-regular fa-heart favorite-heart" id="iconFav"></i>
                            </button>
                        </div>
                    </div>

                    <div class="youtube-mode-label" id="youtubeModeLabel">Chế độ: Phát theo thứ tự</div>
                </div>

                <!-- VIDEO LIST SECTION -->
                <div class="video-section" id="hdYouTubeVideoSection">
                    <div class="video-section-header">
                        <div class="section-title" id="sectionTitle">Danh sách bài hát</div>
                        <div class="section-count" id="videoCount">0 bài</div>
                    </div>

                    <!-- Category Chips Filter -->
                    <div class="category-filter-bar" id="categoryChips">
                        <button class="cat-chip active" data-genre="mck" tabindex="0">🔥 MCK</button>
                        <button class="cat-chip" data-genre="sontung" tabindex="0">👑 Sơn Tùng M-TP</button>
                        <button class="cat-chip" data-genre="denvau" tabindex="0">🎤 Đen Vâu</button>
                        <button class="cat-chip" data-genre="hieuthuhai" tabindex="0">⚡ HIEUTHUHAI</button>
                        <button class="cat-chip" data-genre="lofi" tabindex="0">☕ Lofi Chill</button>
                        <button class="cat-chip" data-genre="vpop" tabindex="0">🔥 V-Pop Hits</button>
                        <button class="cat-chip" data-genre="bolero" tabindex="0">📻 Bolero</button>
                        <button class="cat-chip" data-genre="remix" tabindex="0">🚀 Remix Xe Hơi</button>
                    </div>

                    <!-- Rendered Video Items -->
                    <div class="video-list show" id="mainVideoList">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

            </section>
        </div>

        <footer class="footer">
            APTV CARPLAY DRIVE • Trình phát nhạc xe hơi chuyên nghiệp
        </footer>
    </main>

    <!-- Application JavaScript Engine -->
    <script src="app.js"></script>
</body>
</html>
